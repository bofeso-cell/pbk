<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FM Fit Club</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF8F3; --card:#FFFFFF; --ink:#1C2430; --sub:#63666F;
  --navy:#17382B; --navy-dark:#0E241B; --gold:#B8923D; --gold-light:#D9B968;
  --danger:#B3413A; --ok:#2E7D52; --warn:#B8842A; --line:#E4DCC5;
  --btn-bg:var(--navy); --btn-fg:var(--gold-light); --btn-active:var(--navy-dark); --btn2:var(--navy);
  --radius:16px; color-scheme:light;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#1F2D27; --card:#2B3D35; --ink:#F6F2E9; --sub:#C5CCD9; --line:#44584E;
    --navy:#2A5A44; --navy-dark:#1E4533;
    --btn-bg:#C9A24B; --btn-fg:#10223E; --btn-active:#D9B968; --btn2:#E3C77E;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#1F2D27; --card:#2B3D35; --ink:#F6F2E9; --sub:#C5CCD9; --line:#44584E;
  --navy:#2A5A44; --navy-dark:#1E4533;
  --btn-bg:#C9A24B; --btn-fg:#10223E; --btn-active:#D9B968; --btn2:#E3C77E;
}
*{box-sizing:border-box;}
html{background:var(--bg); scroll-padding-top:env(safe-area-inset-top,0px); height:100%;}
body{
  margin:0; min-height:100%; background:var(--bg); color:var(--ink);
  font-family:'Atkinson Hyperlegible', Arial, Helvetica, sans-serif;
  font-size:19px; line-height:1.4;
}
header{
  position:sticky; top:0; z-index:5;
  padding:calc(18px + env(safe-area-inset-top,0px)) 18px 16px;
  background:var(--navy); color:#fff;
  border-bottom:2px solid var(--gold);
  display:flex; align-items:center; gap:12px;
}
header h1{font-size:22px; margin:0; font-weight:700; flex:1; color:#fff;}
.brandmark{display:flex; align-items:center; gap:12px; flex:1;}
.brandmark .infin{color:var(--gold); font-size:30px; line-height:1;}
.brandmark .txt{line-height:1.15;}
.brandmark .txt .b1{font-family:'Playfair Display',serif; font-weight:700; font-size:22px; color:#fff; letter-spacing:.5px;}
.brandmark .txt .b2{font-size:11px; letter-spacing:2.5px; color:var(--gold-light); font-weight:700;}
.pagelabel{font-size:22px; margin:0; font-weight:700; flex:1; color:#fff;}
.ideiasbtn{flex-shrink:0; background:#5B9BE0; color:#fff; border:none; border-radius:12px; height:44px; padding:0 13px; font-size:15px; font-weight:700; font-family:inherit; cursor:pointer; white-space:nowrap; box-shadow:0 1px 4px rgba(0,0,0,.25);}
.ideiasbtn:active{background:#4A86D1;}
#pageTitle{flex:1; min-width:0;}
.pagelabel,.brandmark{min-width:0;}
.backbtn{
  background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.25); color:#fff; font-size:20px;
  width:48px; height:48px; border-radius:12px; cursor:pointer; flex-shrink:0;
}
main{max-width:640px; margin:0 auto; padding:20px 18px 60px;}
.grid{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
.tile{
  background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
  padding:26px 14px; text-align:center; cursor:pointer; min-height:130px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
  box-shadow:0 2px 6px rgba(0,0,0,.06);
}
.tile .ic{width:40px; height:40px; color:var(--gold);}
.tile .ic svg{width:100%; height:100%;}
.tile .lb{font-size:19px; font-weight:700; color:var(--ink);}
.tile .ct{font-size:15px; color:var(--sub);}
.bigbtn{
  width:100%; padding:18px; font-size:20px; font-weight:700; border:none; border-radius:14px;
  background:var(--btn-bg); color:var(--btn-fg); cursor:pointer; margin-bottom:18px;
}
.bigbtn:active{background:var(--btn-active);}
.bigbtn.secondary{background:transparent; color:var(--btn2); border:2px solid var(--btn2);}
.bigbtn.danger{background:var(--danger); color:#fff;}
.card{
  background:var(--card); border:1px solid var(--line); border-radius:14px;
  padding:16px 16px; margin-bottom:14px; cursor:pointer;
  box-shadow:0 1px 4px rgba(0,0,0,.05);
}
.card .top{display:flex; justify-content:space-between; align-items:center; gap:10px;}
.card .name{font-size:19px; font-weight:700;}
.card .meta{color:var(--sub); font-size:16px; margin-top:4px;}
.card.compact{padding:9px 14px; margin-bottom:8px; box-shadow:none;}
.card.compact .name{font-size:15px;}
.card.compact .meta{font-size:13px; margin-top:1px;}
.card.compact .badge{padding:2px 9px; font-size:12px;}
.card.faded{opacity:.55; padding:6px 14px; margin-bottom:6px;}
.card.faded .name{font-size:14px; font-weight:600;}
.card.faded .meta{font-size:12px; margin-top:0;}
.card.faded .badge{padding:2px 8px; font-size:11px;}
.listdivider{font-size:13px; font-weight:700; color:var(--sub); text-transform:uppercase; letter-spacing:.5px; margin:16px 0 8px;}
#avisoHoraBox{max-width:640px; margin:0 auto; padding:0 18px;}
#avisoHoraBox .avisobtn{display:block; width:100%; min-height:42px; text-align:left; border:none; font-family:inherit; -webkit-tap-highlight-color:transparent; touch-action:manipulation;}
#avisoHoraBox .alertbanner{margin-top:8px; margin-bottom:0; cursor:pointer; font-size:13px; font-weight:600; padding:6px 12px; border-radius:8px;}
.vtag{display:inline-block; font-size:12px; font-weight:700; color:#8A2E28; background:#F6DADA; border-radius:999px; padding:2px 9px; margin-left:6px;}
.vdetails{margin-top:8px; padding-top:8px; border-top:1px dashed var(--line); font-size:14px; line-height:1.5;}
.vchev{font-size:12px; color:var(--sub); margin-left:6px;}
.badge{
  display:inline-block; padding:5px 12px; border-radius:999px; font-size:14px; font-weight:700;
  white-space:nowrap;
}
.empty{text-align:center; color:var(--sub); padding:50px 10px; font-size:18px;}
.splash{
  min-height:calc(100vh - 40px); min-height:calc(100dvh - 40px);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:44px;
  background:var(--navy); margin:-20px -18px -60px; padding:40px 24px;
}
.splash-mark{display:flex; flex-direction:column; align-items:center; gap:10px;}
.splash-infin{color:var(--gold); font-size:64px; line-height:1;}
.splash-b1{font-family:'Playfair Display',serif; font-weight:700; font-size:42px; text-align:center; color:#fff; letter-spacing:1px;}
.splash-b2{font-size:14px; letter-spacing:4px; color:var(--gold-light); font-weight:700;}
.splash .bigbtn{background:var(--gold); color:#071528; margin-bottom:0;}
.splash .bigbtn:active{background:var(--gold-light);}
.splash-btns{display:flex; flex-direction:column; gap:14px; width:100%; max-width:340px; align-items:center;}
.splash-btns .bigbtn{width:100%;}
.bigbtn.secondary-gold{background:transparent; color:var(--gold-light); border:2px solid var(--gold);}
.bigbtn.secondary-gold:active{background:rgba(184,146,61,.15);}
.splash-divider{width:80%; max-width:300px; height:1px; background:rgba(217,185,104,.35); margin:8px 0;}
.kpigrid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
.kpicard{
  background:var(--card); border:1px solid var(--line); border-radius:14px; padding:22px 12px;
  text-align:center; box-shadow:0 1px 4px rgba(0,0,0,.05);
}
.kpival{font-size:26px; font-weight:700; color:var(--navy); font-family:'Playfair Display',serif;}
:root[data-theme="dark"] .kpival{color:var(--gold-light);}
@media (prefers-color-scheme: dark){ .kpival{color:var(--gold-light);} }
.kpilbl{font-size:14px; color:var(--sub); margin-top:6px;}
label{display:block; font-weight:700; margin:16px 0 6px;}
input,select,textarea{
  width:100%; padding:14px; font-size:19px; border-radius:10px; border:2px solid var(--line);
  background:var(--card); color:var(--ink); font-family:inherit;
}
textarea{min-height:80px; resize:vertical;}
.section-title{font-size:15px; text-transform:none; color:var(--sub); margin:22px 0 4px; font-weight:700; border-top:1px solid var(--line); padding-top:16px;}
.checkgrid{display:grid; grid-template-columns:1fr 1fr; gap:8px 12px; margin-top:6px;}
.checkitem{display:flex; align-items:center; gap:8px; font-size:15px; font-weight:400; margin:0;}
.checkitem input[type=checkbox]{width:22px; height:22px; flex-shrink:0; margin:0;}
.codeline{font-family:monospace; font-weight:700; color:var(--gold); font-size:15px; margin-bottom:6px; letter-spacing:.5px;}
.codetag{
  display:inline-block; font-family:monospace; font-size:12.5px; font-weight:700; color:var(--navy);
  background:rgba(184,146,61,.18); padding:2px 8px; border-radius:6px; margin-bottom:4px;
}
:root[data-theme="dark"] .codetag{color:var(--gold-light);}
@media (prefers-color-scheme: dark){ .codetag{color:var(--gold-light);} }
.thumbstrip{display:flex; flex-wrap:wrap; gap:8px; margin-top:8px;}
.thumb{position:relative; width:64px; height:64px;}
.thumb img{width:100%; height:100%; object-fit:cover; border-radius:10px; border:1px solid var(--line);}
.thumbx{
  position:absolute; top:-8px; right:-8px; width:26px; height:26px; border-radius:50%;
  background:var(--danger); color:#fff; border:2px solid var(--card); font-size:15px; line-height:1;
  cursor:pointer; padding:0;
}
.photohint{font-size:13px; color:var(--sub); margin-top:6px;}
.cardthumbs{display:flex; gap:6px; margin-top:8px;}
.cardthumbs img{width:44px; height:44px; object-fit:cover; border-radius:8px; border:1px solid var(--line);}
.modal-overlay{position:fixed; inset:0; background:rgba(11,31,58,.55); display:flex; align-items:flex-start; justify-content:center; z-index:50; padding:24px; overflow-y:auto;}
.modal-box{background:var(--card); border-radius:16px; padding:24px; max-width:400px; width:100%; box-shadow:0 10px 30px rgba(0,0,0,.3); margin:auto; max-height:none;}
.modal-msg{font-size:18px; margin-bottom:20px; color:var(--ink); line-height:1.4;}
.reporthead{display:flex; justify-content:space-between; font-size:13px; color:var(--sub); font-weight:700; padding:0 4px; margin-top:4px;}
.reportrow{
  display:flex; justify-content:space-between; align-items:center; gap:10px;
  background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-top:8px;
}
.reportname{font-size:15px; font-weight:700; flex:1;}
.reportvals{display:flex; flex-direction:column; align-items:flex-end; font-size:14px; color:var(--sub); gap:2px;}
.reportvals .reportcom{color:var(--ok); font-weight:700; font-size:15px;}
.consultheader{background:var(--navy); color:#fff; border-radius:16px; padding:24px 20px; margin-bottom:18px; text-align:center;}
.consultbrand{font-family:'Playfair Display',serif; font-weight:700; font-size:24px; color:var(--gold);}
.consultbrand span{display:block; font-size:13px; letter-spacing:3px; color:var(--gold-light); margin-top:4px;}
.consultsub{font-size:14px; color:#EDE6D5; margin-top:10px; line-height:1.4;}
#searchInput{margin-bottom:14px;}
#searchResults .card{margin-bottom:10px;}
.avisobtn2{display:block; width:100%; text-align:left; border:none; font-family:inherit; cursor:pointer; touch-action:manipulation;}
.alertbanner{border-radius:12px; padding:12px 16px; font-size:15px; font-weight:700; margin-bottom:10px;}
.alert-red{background:#F6DADA; color:#8A2E28;}
.alert-gold{background:#FCEFC7; color:#8A5A00;}
.funilboard{display:flex; gap:12px; overflow-x:auto; margin:0 -18px; padding:4px 18px 14px;}
.funilcol{flex:0 0 230px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:10px;}
.funilcolhead{border-radius:8px; padding:8px 10px; font-weight:700; font-size:14px; margin-bottom:10px; text-align:center;}
.funilcard{background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:10px; margin-bottom:8px; cursor:pointer;}
.funilcard .name{font-size:14px; font-weight:700; line-height:1.3;}
.funilcard .meta{font-size:13px; color:var(--sub); margin-top:2px;}
.contractpaper{
  background:#fff; color:#1a1a1a; border:1px solid var(--line); border-radius:10px;
  padding:20px; font-family:Georgia,'Times New Roman',serif; font-size:14px; line-height:1.6;
  white-space:pre-wrap; min-height:300px;
}
@media print{
  body *{visibility:hidden;}
  .contractpaper, .contractpaper *{visibility:visible;}
  .contractpaper{position:relative; border:none; padding:0; margin-bottom:20px;}
}
.sigcanvas{width:100%; max-width:320px; height:120px; background:#fdfdfa; border:2px dashed #ccc; border-radius:8px; touch-action:none; display:block;}
.siglabel{font-weight:700; font-size:14px; color:var(--sub); margin-bottom:6px;}
.rowbtns{display:flex; gap:12px; margin-top:26px;}
.rowbtns .bigbtn{margin-bottom:0;}
.toast{
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
  background:var(--navy-dark); color:var(--gold-light); padding:14px 22px; border-radius:12px; font-size:17px;
  box-shadow:0 4px 14px rgba(0,0,0,.25); z-index:20; max-width:90%; text-align:center;
}
.banner{
  background:#F4E6C9; color:#5B4413; padding:12px 16px; border-radius:12px; font-size:15px;
  margin-bottom:16px; display:none;
}
.bigbtn:disabled{opacity:.4; cursor:not-allowed;}
#bottomNav{max-width:640px; margin:0 auto; padding:0 18px 40px;}
.lockbox{background:#F6DADA; color:#8A2E28; border-radius:12px; padding:12px 16px; font-size:15px; margin:12px 0;}
.lockbox.ok{background:#DDF0E4; color:#175C3F;}
.lockbox ul{margin:8px 0 0; padding-left:20px;}
.viewer-mode .admin-only{display:none !important;}
.card.destaque{background:#FFF0D2; border:2px solid #D9A23A; box-shadow:0 0 0 3px rgba(217,162,58,.25);}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .card.destaque{background:#5E4B1F; border-color:#E3C77E; box-shadow:0 0 0 3px rgba(227,199,126,.25);} }
:root[data-theme="dark"] .card.destaque{background:#5E4B1F; border-color:#E3C77E; box-shadow:0 0 0 3px rgba(227,199,126,.25);}
.ideiarow{display:flex; gap:12px; align-items:flex-start;}
.ideiabody{flex:1; min-width:0;}
.ideiabody .txt{white-space:pre-wrap; word-break:break-word; font-size:17px;}
.ideiachk{width:28px; height:28px; padding:0; margin:2px 0 0; flex-shrink:0; accent-color:var(--gold);}
.ideia-done .txt{text-decoration:line-through; opacity:.6;}
.party{position:fixed; inset:0; z-index:40; display:flex; flex-direction:column; align-items:center; justify-content:center; pointer-events:none; animation:partyfade 2.3s ease forwards; overflow:hidden;}
.partyemoji{font-size:96px; line-height:1; animation:partypop .7s cubic-bezier(.2,1.6,.4,1);}
.partytxt{background:var(--navy-dark); color:var(--gold-light); font-weight:700; font-size:20px; padding:10px 18px; border-radius:14px; margin-top:12px; box-shadow:0 4px 14px rgba(0,0,0,.3);}
.confetti{position:absolute; top:-40px; animation:confettifall 1.9s ease-in forwards;}
@keyframes partypop{0%{transform:scale(.2); opacity:0;} 100%{transform:scale(1); opacity:1;}}
@keyframes confettifall{to{transform:translateY(110vh) rotate(360deg);}}
@keyframes partyfade{0%,80%{opacity:1;} 100%{opacity:0;}}
.lockval{display:inline-flex; align-items:center; justify-content:center; min-width:40px; height:30px; padding:0 10px; border-radius:999px; background:var(--line); color:var(--ink); font-size:16px; cursor:pointer; vertical-align:middle;}
body.ocultar input[type=number]{-webkit-text-security:disc;}
.ideiasbtn{padding:0 10px;font-size:14px;}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
<header id="mainHeader">
  <button class="backbtn" id="backBtn" style="display:none" aria-label="Voltar">←</button>
  <div id="pageTitle"></div>
  <button type="button" class="ideiasbtn" id="ocultarBtn" style="background:var(--gold); color:#071528;" aria-label="Ocultar valores">👁️ Ocultar</button>
  <button type="button" class="ideiasbtn" id="ideiasBtn" aria-label="Ideias">💡 Ideias</button>
</header>
<div id="avisoHoraBox"></div>
<main id="app"></main>
<div id="bottomNav" style="display:none"><button type="button" class="bigbtn secondary" id="bottomBack">← Voltar</button></div>

<script>
const ICONS = {
  house: `<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 22 24 8l17 14"/><path d="M11 19v19a1 1 0 0 0 1 1h9V29h6v10h9a1 1 0 0 0 1-1V19"/></svg>`,
  people: `<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="16" r="6"/><path d="M6 39c0-7 5-11 12-11s12 4 12 11"/><circle cx="33" cy="18" r="5"/><path d="M30 28c6 .3 9 4 9 11"/></svg>`,
  calendar: `<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="10" width="34" height="30" rx="3"/><path d="M7 19h34"/><path d="M15 6v8M33 6v8"/><path d="M15 27h6M15 33h6M27 27h6"/></svg>`,
  coin: `<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="24" cy="24" r="17"/><path d="M24 15v18M29 19.5c0-2.5-2.4-4-5.4-4-3.3 0-5.6 1.7-5.6 4.2 0 5.3 11 2.6 11 7.9 0 2.6-2.5 4.4-5.7 4.4-3.2 0-5.9-1.6-5.9-4.4"/></svg>`
};
const UF = ["AC","AL","AP","AM","BA","CE","DF","ES","GO","MA","MT","MS","MG","PA","PB","PR","PE","PI","RJ","RN","RS","RO","RR","SC","SP","SE","TO"];
ICONS.id = `<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="11" width="36" height="26" rx="3"/><circle cx="18" cy="22" r="4"/><path d="M11 32c1-5 13-5 14 0M29 20h9M29 26h9"/></svg>`;
const EC = ["Solteiro(a)","Casado(a)","Divorciado(a)","Viúvo(a)","União estável"];
const RB = ["Comunhão parcial de bens","Comunhão universal de bens","Separação total de bens","Participação final nos aquestos","Outro"];
const GRPS = ['pf','pj','casado'];
const F = (key,label,req,type,options,grp)=>({key,label,req,type:type||'text',options,extra:true,grp:grp||(GRPS.includes(req)?req:undefined)});
const S = (label,grp)=>({type:'section',label,grp,extra:true});
const ENDERECO = [S('Endereço'),F('cep','CEP','all'),F('logradouro','Logradouro','all'),F('numero','Número','all'),F('complemento','Complemento'),F('bairro','Bairro','all'),F('cidade','Cidade','all'),F('estado','Estado (UF)','all','select',UF)];
const PESSOA_EXTRA = [
  S('Contato'),F('whatsapp','WhatsApp'),F('email','E-mail','all'),
  S('Pessoa Física — identificação','pf'),
  F('cpf','CPF','pf'),F('rg','RG','pf'),F('orgaoExpedidor','Órgão expedidor','pf'),F('dataNascimento','Data de nascimento','pf','date'),
  F('nacionalidade','Nacionalidade','pf'),F('estadoCivil','Estado civil','pf','select',EC),F('profissao','Profissão','pf'),
  S('Cônjuge e regime de bens','casado'),
  F('regimeBens','Regime de bens','casado','select',RB),F('conjugeNome','Nome do cônjuge','casado'),F('conjugeCpf','CPF do cônjuge','casado'),F('conjugeRg','RG do cônjuge','casado'),
  S('Pessoa Jurídica','pj'),
  F('razaoSocial','Razão social','pj'),F('nomeFantasia','Nome fantasia',null,'text',null,'pj'),F('cnpj','CNPJ','pj'),F('inscricaoEstadual','Inscrição estadual',null,'text',null,'pj'),
  F('representanteNome','Representante legal','pj'),F('representanteCpf','CPF do representante','pj'),F('representanteRg','RG do representante','pj'),
  F('representanteCargo','Cargo/função','pj'),F('atoSocietario','Ato societário/procuração que fundamenta a representação','pj'),
  ...ENDERECO,
  S('Documentos recebidos'),
  {key:'documentos',label:'',type:'checklist',extra:true,options:["Documento de identidade","CPF","Comprovante de endereço","Certidão de estado civil","Documentos do cônjuge","Matrícula atualizada do imóvel","Certidões negativas","Outros documentos"]},
  {key:'documentosArquivos', label:'Enviar documentos (foto ou PDF — RG, CNH, CPF...)', type:'docfiles', max:6, extra:true, docHelp:true},
];

function resizeImage(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        const maxDim = 1600;
        let {width, height} = img;
        if(width > maxDim || height > maxDim){
          const scale = maxDim / Math.max(width, height);
          width = Math.round(width*scale); height = Math.round(height*scale);
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        canvas.toBlob(blob=> blob ? resolve(blob) : reject(new Error('toBlob falhou')), 'image/jpeg', 0.82);
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
function nextCode(modKey, list){
  const pre = CODE_PREFIX[modKey]; let max = 0;
  list.forEach(x=>{ const cd = x.codigoSistema||''; if(cd.startsWith(pre)){ const n = parseInt(cd.slice(pre.length),10); if(n>max) max=n; } });
  return pre + String(max+1).padStart(3,'0');
}
let codeLock = Promise.resolve();
function ensureCodes(modKey){
  codeLock = codeLock.catch(()=>{}).then(()=>_ensureCodes(modKey));
  return codeLock;
}
async function _ensureCodes(modKey){
  const items = await getAll(modKey);
  const pre = CODE_PREFIX[modKey]; const seen = new Set(); let max = 0;
  items.forEach(x=>{ const cd = x.codigoSistema||''; if(cd.startsWith(pre)){ const n = parseInt(cd.slice(pre.length),10); if(n>max) max=n; } });
  for(const it of items){
    let changed = false;
    if(!it.codigoSistema || !it.codigoSistema.startsWith(pre) || seen.has(it.codigoSistema)){
      it.codigoSistema = pre + String(++max).padStart(3,'0'); changed = true;
    }
    seen.add(it.codigoSistema);
    if(modKey==='clientes' && !it.dataCadastro){ it.dataCadastro = new Date().toISOString().slice(0,10); changed = true; }
    if(changed){ const {id, ...rest} = it; try{ await saveDoc(modKey, id, rest); }catch(e){} }
  }
  return items;
}

async function getAll(modKey){
  if(db){
    try{
      const snap = await db.collection(modKey).get();
      return snap.docs.map(d=>({id:d.id, ...d.data()}));
    }catch(e){ return memory[modKey]; }
  }
  return memory[modKey];
}
async function saveDoc(modKey, id, data){
  if(db){
    try{ await db.collection(modKey).doc(id).set(data); return; }catch(e){}
  }
  const idx = memory[modKey].findIndex(x=>x.id===id);
  const rec = {id, ...data};
  if(idx>=0) memory[modKey][idx]=rec; else memory[modKey].push(rec);
}
async function deleteDoc(modKey, id){
  if(db){
    try{ await db.collection(modKey).doc(id).delete(); return; }catch(e){}
  }
  memory[modKey] = memory[modKey].filter(x=>x.id!==id);
}

let focoVisitas = false;
function minParaVisita(v){
  if(!(v.status==='Agendada'||v.status==='Confirmada') || !v.data || !v.horario) return null;
  const p = v.data.split('-'), t = v.horario.split(':');
  if(p.length!==3 || t.length<2) return null;
  const when = new Date(+p[0],+p[1]-1,+p[2],+t[0],+t[1]).getTime();
  const min = Math.ceil((when-Date.now())/60000);
  return (min>=0 && min<=60) ? min : null;
}

  if(!currentRole || !dbReady || state.screen==='splash'){ box.innerHTML=''; return; }

    const out = list.map(v=>({v, min:minParaVisita(v)})).filter(o=>o.min!==null).sort((a,b)=>a.min-b.min);
    if(!out.length){ box.innerHTML=''; return; }
    const o = out[0];
    const txt = `⏰ Visita ${o.min===0?'agora':'em '+o.min+' min'}${o.v.cliente?' — '+o.v.cliente:''}${out.length>1?' (+'+(out.length-1)+')':''}`;
    box.innerHTML = `<button type="button" class="alertbanner alert-red avisobtn">${txt.replace(/</g,'&lt;')}</button>`;
  }).catch(()=>{});
}

function aplicarMarca(img, pos, op){
  const sc = Math.min(1, 1600/Math.max(img.width,img.height));
  const w = Math.round(img.width*sc), h = Math.round(img.height*sc);
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d'); x.drawImage(img,0,0,w,h);
  const fs = Math.max(18, Math.round(w*0.045));
  x.globalAlpha = op; x.fillStyle = '#fff'; x.shadowColor = 'rgba(0,0,0,.6)'; x.shadowBlur = fs*0.25;
  if(pos==='centro'){
    x.save(); x.translate(w/2,h/2); x.rotate(-Math.PI/8); x.textAlign='center'; x.textBaseline='middle';
    x.font = `bold ${fs*2}px sans-serif`; x.fillText('FM Fit Club',0,0);
    x.font = `${fs*0.8}px sans-serif`; x.fillText('TRANSFORMAÇÃO QUE VESTE',0,fs*1.4); x.restore();
  }else{
    x.textAlign='right'; x.textBaseline='bottom';
    x.font = `bold ${fs}px sans-serif`; x.fillText('FM Fit Club', w-fs*0.6, h-fs*1.2);
    x.font = `${fs*0.45}px sans-serif`; x.fillText('TRANSFORMAÇÃO QUE VESTE', w-fs*0.6, h-fs*0.5);
  }
  return c;
}

async function pdfFromText(text, filename){
  try{
    if(!window.jspdf){ toast('Gerador de PDF indisponível nesta visualização.'); return; }
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({unit:'pt', format:'a4'});
    const marginX = 48, marginY = 56, maxWidth = 500, lineHeight = 14;
    doc.setFont('times','normal'); doc.setFontSize(11);
    const lines = doc.splitTextToSize(text, maxWidth);
    let y = marginY;
    const pageHeight = doc.internal.pageSize.getHeight();
    lines.forEach(line=>{
      if(y > pageHeight - marginY){ doc.addPage(); y = marginY; }
      doc.text(line, marginX, y);
      y += lineHeight;
    });
    const blob = doc.output('blob');
    if(downloadsApi){
      await downloadsApi.save({filename, data: blob});
      toast('PDF gerado!');
    }else{
      toast('Download indisponível nesta visualização.');
    }
  }catch(e){ toast('Não foi possível gerar o PDF.'); }
}

function isReqActive(f, rec){
  if(!f.req) return false;
  const pj = rec.tipoPessoa==='Pessoa Jurídica';
  if(f.req==='all') return true;
  if(f.req==='pf') return !pj;
  if(f.req==='pj') return pj;
  if(f.req==='casado') return !pj && ['Casado(a)','União estável'].includes(rec.estadoCivil);
  return false;
}
function missingFor(fields, rec){
  return fields.filter(f=>f.key && isReqActive(f,rec) && !String(rec[f.key]||'').trim()).map(f=>f.label);
}
function endStr(p){
  const a = [p.logradouro && (p.logradouro + (p.numero ? ', nº '+p.numero : '')), p.complemento, p.bairro, p.cidade && (p.cidade + (p.estado ? '/'+p.estado : '')), p.cep && ('CEP '+p.cep)].filter(Boolean);
  return a.length ? a.join(', ') : (p.enderecoCompleto||'');
}
function docPessoa(p){
  return p.tipoPessoa==='Pessoa Jurídica' ? 'CNPJ '+(p.cnpj||'[CNPJ]') : 'CPF '+(p.cpf||p.cpfCnpj||'[CPF]');
}
function descPessoa(p, papel){
  p = p || {};
  const B = (v, r)=> v || ('['+r+']');
  if(p.tipoPessoa==='Pessoa Jurídica'){
    return `${B(p.razaoSocial||p.nome,'RAZÃO SOCIAL')}${p.nomeFantasia?' ('+p.nomeFantasia+')':''}, inscrita no CNPJ nº ${B(p.cnpj,'CNPJ')}${p.inscricaoEstadual?', IE nº '+p.inscricaoEstadual:''}, com sede em ${B(endStr(p),'endereço')}, neste ato representada por ${B(p.representanteNome,'REPRESENTANTE')}, ${B(p.representanteCargo,'cargo')}, RG nº ${B(p.representanteRg,'RG')}, CPF nº ${B(p.representanteCpf,'CPF')}${p.atoSocietario?', conforme '+p.atoSocietario:''}, e-mail ${B(p.email,'e-mail')}, telefone ${B(p.telefone,'telefone')}, doravante denominada ${papel}`;
  }
  const casado = ['Casado(a)','União estável'].includes(p.estadoCivil);
  return `${B(p.nome,'NOME')}, ${B(p.nacionalidade,'nacionalidade')}, ${B(p.estadoCivil,'estado civil')}${casado&&p.regimeBens?' (regime: '+p.regimeBens+')':''}, ${B(p.profissao,'profissão')}, nascido(a) em ${p.dataNascimento?fmtDate(p.dataNascimento):'[data de nascimento]'}, RG nº ${B(p.rg,'RG')}${p.orgaoExpedidor?' '+p.orgaoExpedidor:''}, CPF nº ${B(p.cpf||p.cpfCnpj,'CPF')}, e-mail ${B(p.email,'e-mail')}, telefone ${B(p.telefone,'telefone')}, residente e domiciliado(a) em ${B(endStr(p),'endereço')}${casado&&p.conjugeNome?`, casado(a)/convivente com ${p.conjugeNome}, CPF nº ${B(p.conjugeCpf,'CPF do cônjuge')}, RG nº ${B(p.conjugeRg,'RG do cônjuge')}, que também comparece e anui`:''}, doravante denominado(a) ${papel}`;
}

function contractMissing(im, vend, cl, perfil, clienteId){
  const out = []; const add = (t, arr)=>{ if(arr.length) out.push([t, arr]); };
  add('Imóvel/Empresa', im.id ? [['endereco','endereço'],['cidade','cidade'],['valor','valor']].filter(([k])=>!String(im[k]||'').trim()).map(x=>x[1]) : ['selecione o imóvel/empresa']);
  add('Vendedor/Proprietário', vend ? missingFor(MODULES.proprietarios.fields, vend) : ['vincule um proprietário cadastrado (imóvel → cadastro completo → Proprietário cadastrado)']);
  add('Comprador/Locatário', clienteId ? missingFor(MODULES.clientes.fields, cl) : ['selecione o comprador/locatário']);
  add('Corretor (Consultoria → Meus dados)', missingFor(PERFIL_FIELDS, perfil));
  return out;
}
function applyLock(faltas){
  const locked = faltas.length > 0;
  document.getElementById('lockBox').innerHTML = locked
    ? `<div class="lockbox">🔒 <b>Cadastro incompleto</b> — o contrato só pode ser editado, enviado e assinado depois de preencher o cadastro completo:<ul>${faltas.map(([t,a])=>`<li><b>${t}:</b> ${a.join(', ')}</li>`).join('')}</ul></div>`
    : '<div class="lockbox ok">✅ Cadastro completo — contrato liberado.</div>';
  document.getElementById('contractText').contentEditable = locked ? 'false' : 'true';
  ['copyBtn','printBtn','pdfBtn'].forEach(i=>{ document.getElementById(i).disabled = locked; });
  const sb = document.getElementById('sigBox');
  sb.style.pointerEvents = locked ? 'none' : ''; sb.style.opacity = locked ? '.4' : '';
}

  `;
  app.appendChild(wrap);

  function getImovel(){
    if(id) return items.find(x=>x.id===id) || {};
    const sel = document.getElementById('imovelContrato');
    return sel ? (items.find(x=>x.id===sel.value) || {}) : {};
  }
  function gerar(){
    const im = getImovel();
    const tipo = document.getElementById('tipoContrato').value;
    const clienteId = document.getElementById('clienteContrato').value;
    const cl = clientesList.find(c=>c.id===clienteId) || {};
    const vend = propList.find(p=>p.id===im.proprietarioId) || null;
    const V = vend || {nome: im.proprietario};
    let texto;
    if(modo==='simples'){
      texto = tipo==='aluguel' ? contratoSimplesAluguel(im, cl, hoje, perfil, V) : contratoSimplesVenda(im, cl, hoje, perfil, V);
    }else{
      texto = tipo==='aluguel' ? contratoAluguel(im, cl, hoje, perfil, V) : contratoVenda(im, cl, hoje, perfil, V);

                         .replace(/\[À VISTA \/ FINANCIAMENTO \/ ENTRADA \+ PARCELAS\]/g, formaPag);

    applyLock(contractMissing(im, vend, cl, perfil, clienteId));

  document.getElementById('tipoContrato').onchange = gerar;

  function setupSignature(canvasId){
    const canvas = document.getElementById(canvasId);
    const ctx = canvas.getContext('2d');
    ctx.strokeStyle = '#1a1a1a'; ctx.lineWidth = 2; ctx.lineCap = 'round';
    let drawing = false, last = null;
    function pos(e){
      const r = canvas.getBoundingClientRect();
      return {x:(e.clientX-r.left)*canvas.width/r.width, y:(e.clientY-r.top)*canvas.height/r.height};
    }
    canvas.addEventListener('pointerdown', e=>{ drawing=true; last=pos(e); e.preventDefault(); });
    canvas.addEventListener('pointermove', e=>{
      if(!drawing) return;
      const p = pos(e);
      ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke();
      last = p; e.preventDefault();
    });
    window.addEventListener('pointerup', ()=> drawing=false);
    return ctx;
  }
  const ctx1 = setupSignature('sigCanvas1');
  const ctx2 = setupSignature('sigCanvas2');
  document.getElementById('clearSig1').onclick = ()=> ctx1.clearRect(0,0,320,120);

    3. Toque em <strong>"Assinar documento"</strong> e depois em <strong>"Selecionar arquivo"</strong> — escolha o PDF que você acabou de baixar.<br>
    4. Faça login com sua conta <strong>gov.br</strong> (a mesma senha do aplicativo "gov.br" ou "Meu INSS").<br>
    5. Confira se o nome do documento está certo e toque no botão verde <strong>"Assinar"</strong>.<br>
    6. Pronto! Baixe o arquivo assinado — ele já vem com o carimbo oficial de validade jurídica.<br>
    7. Para a outra parte assinar também, é só mandar o mesmo PDF (ou o link que o site gerar) pelo WhatsApp, e ela repete os passos 2 a 6 com a conta gov.br dela.`);
  };

  document.getElementById('copyBtn').onclick = async ()=>{
    const im = getImovel();
    if(!await confirmModal(`Confira antes de continuar: o valor deste contrato é <b>${fmtMoney(im.valor)}</b>. Está correto?`, 'Sim, está correto', '')) return;
    try{
      await navigator.clipboard.writeText(document.getElementById('contractText').innerText);
      toast('Texto copiado!');
    }catch(e){ toast('Não foi possível copiar automaticamente. Selecione e copie manualmente.'); }
  };
  document.getElementById('printBtn').onclick = async ()=>{
    const im = getImovel();
    if(!await confirmModal(`Confira antes de continuar: o valor deste contrato é <b>${fmtMoney(im.valor)}</b>. Está correto?`, 'Sim, está correto', '')) return;
    window.print();
  };
  document.getElementById('pdfBtn').onclick = async ()=>{
    const im = getImovel();
    if(!await confirmModal(`Confira antes de continuar: o valor deste contrato é <b>${fmtMoney(im.valor)}</b>. Está correto?`, 'Sim, está correto', '')) return;
    const texto = document.getElementById('contractText').innerText;
    const fname = (modo==='simples'?'contrato-simples-':'contrato-') + document.getElementById('tipoContrato').value + '.pdf';
    pdfFromText(texto, fname);
  };
}

async function gerarPdfImovel(i, fotoIds, caracts, specs){
  if(!window.jspdf){ toast('Gerador de PDF indisponível nesta visualização.'); return; }
  toast('Gerando PDF…');
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:'pt', format:'a4'});
  const W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight(), ML = 48, MR = W-48;
  let y = 0;
  const need = n=>{ if(y+n > H-60){ doc.addPage(); y = 56; } };
  doc.setFillColor(11,31,58); doc.rect(0,0,W,70,'F');
  doc.setFont('helvetica','bold'); doc.setFontSize(20); doc.setTextColor(217,185,104); doc.text('FM FIT CLUB', ML, 36);
  doc.setFontSize(9); doc.setTextColor(255,255,255); doc.text('TRANSFORMACAO QUE VESTE', ML, 52);
  y = 100;
  doc.setTextColor(11,31,58); doc.setFont('helvetica','bold'); doc.setFontSize(18);
  doc.splitTextToSize(i.titulo||i.endereco||'Imovel', MR-ML).forEach(l=>{ doc.text(l, ML, y); y+=22; });

  if(specs){ doc.setFont('helvetica','normal'); doc.setFontSize(12); doc.setTextColor(30,30,30); doc.text(specs, ML, y); y+=24; }
  const imgs = [];
  for(const pid of fotoIds.slice(0,4)){
    try{
      const blob = await (await fetch('/_blob/'+pid)).blob();
      const url = await new Promise(r=>{ const fr=new FileReader(); fr.onload=()=>r(fr.result); fr.readAsDataURL(blob); });
      const dim = await new Promise(r=>{ const im=new Image(); im.onload=()=>r([im.width,im.height]); im.onerror=()=>r(null); im.src=url; });
      if(dim) imgs.push({url, w:dim[0], h:dim[1], fmt: /png/i.test(blob.type)?'PNG':'JPEG'});
    }catch(e){}
  }
  if(imgs.length){
    const f = imgs[0], mw = MR-ML, mh = 260, sc = Math.min(mw/f.w, mh/f.h);
    need(f.h*sc+10); doc.addImage(f.url, f.fmt, ML, y, f.w*sc, f.h*sc); y += f.h*sc + 10;
    if(imgs.length>1){
      const cw = (mw-16)/Math.min(3, imgs.length-1), ch = 110; need(ch+10);
      imgs.slice(1,4).forEach((m,k)=>{ const s2 = Math.min(cw/m.w, ch/m.h); doc.addImage(m.url, m.fmt, ML+k*(cw+8), y, m.w*s2, m.h*s2); });
      y += ch + 14;
    }
  }
  const bloco = (titulo, texto)=>{
    if(!texto) return;
    need(40); doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.setTextColor(11,31,58); doc.text(titulo, ML, y); y+=16;
    doc.setFont('helvetica','normal'); doc.setFontSize(11); doc.setTextColor(40,40,40);
    doc.splitTextToSize(texto, MR-ML).forEach(l=>{ need(16); doc.text(l, ML, y); y+=15; }); y+=8;
  };
  bloco('Descricao', i.descricaoCompleta);
  bloco('Diferenciais', i.diferenciais);
  bloco('Caracteristicas', caracts.join('  -  '));
  doc.setDrawColor(217,185,104); doc.line(ML, H-46, MR, H-46);
  doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(90,90,90);
  doc.text('FM Fit Club Imoveis & Negocios  |  WhatsApp (17) 98174-0013', ML, H-30);
  const filename = 'imovel-'+((i.codigoSistema||i.endereco||'detalhes').toString().replace(/[^a-z0-9]+/gi,'-').toLowerCase())+'.pdf';
  const blob = doc.output('blob');
  try{
    const file = new File([blob], filename, {type:'application/pdf'});
    if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title: i.titulo||i.endereco||'Imovel'}); return; }
  }catch(e){ if(e && e.name==='AbortError') return; }
  if(downloadsApi){ try{ await downloadsApi.save({filename, data: blob}); toast('PDF salvo! Agora é só enviar.'); }catch(e){ toast('Não foi possível salvar o PDF.'); } }
  else toast('Download indisponível nesta visualização.');
}

function icsDate(dateStr, timeStr){
  const [y,m,d] = (dateStr||'').split('-');
  if(!y) return null;
  const [hh,mm] = (timeStr||'09:00').split(':');
  return `${y}${m}${d}T${(hh||'09').padStart(2,'0')}${(mm||'00').padStart(2,'0')}00`;
}
async function exportarVisitaICS(v){
  const dt = icsDate(v.data, v.horario);
  if(!dt){ toast('Essa visita não tem data válida.'); return; }
  const ics = `BEGIN:VCALENDAR
VERSION:2.0
PRODID:-//FM Fit Club Imoveis e Negocios//PT-BR
BEGIN:VEVENT
UID:${'visita-'+(v.id||Date.now())}@payback
DTSTART:${dt}
SUMMARY:Visita — ${v.imovel||'Imóvel'} (${v.cliente||'cliente'})
DESCRIPTION:${(v.obs||'').replace(/\n/g,'\\n')}
END:VEVENT
END:VCALENDAR`;
  if(downloadsApi){
    try{
      await downloadsApi.save({filename:'visita.ics', data: ics});
      toast('Arquivo .ics salvo — importe no Outlook, Google Agenda ou Apple Calendar.');
    }catch(e){ toast('Não foi possível gerar o arquivo.'); }
  }else{
    toast('Download indisponível nesta visualização.');
  }
}

  aBox.onclick = e=>{ if(e.target.closest('.avisobtn2')) go('estoque'); };
}

async function renderList(modKey){
  const m = MODULES[modKey];
  pageTitle.innerHTML = `<div class="pagelabel">${m.label}</div>`;
  const wrap = document.createElement('div');
  const contratosBtns = false ? `
    <div class="rowbtns" style="margin-bottom:14px;">
      <button type="button" class="bigbtn secondary" id="contratoSimplesBtn" style="flex:1;">📄 Contrato Simples</button>
      <button type="button" class="bigbtn secondary" id="contratoPersonalBtn" style="flex:1;">📄 Contrato Personalizado</button>
    </div>` : '';

  const fichaBtn = modKey==='imoveis' ? `<button type="button" class="bigbtn secondary" id="fichaTecnicaBtn">📋 Ficha Técnica (captação — PDF em branco)</button>` : '';
  wrap.innerHTML = `<button class="bigbtn admin-only" id="addBtn">+ Adicionar ${m.addLabel}</button><div class="admin-only">${contratosBtns}${fichaBtn}${calcBtn}</div><div id="listWrap"></div>`;

  if(modKey==='imoveis'){
    document.getElementById('fichaTecnicaBtn').onclick = gerarFichaTecnica;
  }
  const listWrap = document.getElementById('listWrap');
  listWrap.innerHTML = '<div class="empty">Carregando…</div>';
  let items = await getAll(modKey);
  items = await ensureCodes(modKey);
  listWrap.innerHTML = '';
  if(modKey==='caixa'){
    items = await atualizarAtrasados();
    const doMes = items.filter(f=>(f.data||'').startsWith(finMes));
    const soma = fn=>doMes.filter(fn).reduce((a,f)=>a+(parseFloat(f.valor)||0),0);
    const rec = soma(f=>f.tipo==='Receita'&&f.status==='Recebido'), aRec = soma(f=>f.tipo==='Receita'&&f.status==='Previsto'), atr = soma(f=>f.tipo==='Receita'&&f.status==='Atrasado'), desp = soma(f=>f.tipo==='Despesa');
    const cats = {}; doMes.filter(f=>f.tipo==='Despesa').forEach(f=>{ const c=f.categoria||'Outros'; cats[c]=(cats[c]||0)+(parseFloat(f.valor)||0); });
    const [ay,am] = finMes.split('-'); const nomeMes = new Date(+ay,+am-1,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
    const box = (lb,v,cor)=>`<div style="background:var(--card); border:2px solid var(--line); border-radius:14px; padding:10px 12px;"><div class="meta" style="font-size:13px;">${lb}</div><div style="font-weight:700; font-size:17px; color:${cor};">${fmtMoney(v)}</div></div>`;
    const old = document.getElementById('finResumo'); if(old) old.remove();
    listWrap.insertAdjacentHTML('beforebegin', `<div id="finResumo" style="margin-bottom:14px;">
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;"><button type="button" class="bigbtn secondary" id="finPrev" style="width:48px; margin:0; padding:6px;">‹</button><strong style="text-transform:capitalize;">${nomeMes}</strong><button type="button" class="bigbtn secondary" id="finNext" style="width:48px; margin:0; padding:6px;">›</button></div>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">${box('Recebido',rec,'var(--ok)')}${box('A receber',aRec,'var(--warn)')}${box('Atrasado',atr,'var(--danger)')}${box('Despesas',desp,'var(--danger)')}</div>
      <div style="margin-top:8px;">${box('Saldo do mês',rec-desp,(rec-desp)>=0?'var(--ok)':'var(--danger)')}</div>
      ${Object.keys(cats).length?`<div class="meta" style="margin-top:8px; font-size:13px;">Despesas por categoria: ${Object.entries(cats).map(([c,v])=>c+' '+fmtMoney(v)).join(' · ')}</div>`:''}</div>`);
    const mover = n=>{ const d=new Date(+ay,+am-1+n,1); finMes = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); go('list','caixa'); };
    document.getElementById('finPrev').onclick = ()=>mover(-1); document.getElementById('finNext').onclick = ()=>mover(1);
    items = doMes;
  }
  if(modKey==='visitas'){
    const rank = v=> v.status==='Cancelada' ? 2 : v.status==='Realizada' ? 1 : 0;
    const key = v=> (v.data||'')+(v.horario||'');
    items = [...items].sort((a,b)=> rank(a)-rank(b) || (rank(a)===0 ? key(a).localeCompare(key(b)) : key(b).localeCompare(key(a))));
  }
  if(items.length===0){
    listWrap.innerHTML = `<div class="empty">Nenhum registro ainda.<br>Toque em "Adicionar" para começar.</div>`;
    return;
  }
  const cliAll = modKey==='vendas' ? await getAll('clientesLoja') : [];
  let lastRank = -1;
  items.forEach(item=>{
    const status = modKey==='produtos' ? sitProd(item) : modKey==='insumos' ? sitIns(item) : (item[m.statusField] || '');
    const colors = (m.statusColors[status]||'#eee;#555').split(';');
    const vRank = modKey==='visitas' ? (status==='Cancelada' ? 2 : status==='Realizada' ? 1 : 0) : 0;
    const card = document.createElement('div');
    card.className='card' + (vRank===1?' compact':'') + (vRank===2?' faded':'');
    const title = item[m.titleField] || '(sem nome)';
    let sub = item[m.subField] || '';
    if(m.subField==='data') sub = fmtDate(sub);
    if(modKey==='visitas'){
      const quando = [fmtDate(item.data), item.horario].filter(Boolean).join(' às ');
      sub = vRank>0 ? quando : [quando, item.cliente].filter(Boolean).join(' · ');
      if(vRank!==lastRank && vRank>0){
        const dv = document.createElement('div'); dv.className='listdivider';
        dv.textContent = vRank===1 ? 'Realizadas' : 'Canceladas';
        listWrap.appendChild(dv);
      }
      lastRank = vRank;
    }
    if(modKey==='produtos') sub = [item.categoria, item.cor, totalPc(item)+' peça(s)'].filter(Boolean).join(' · ');
    if(modKey==='insumos') sub = (item.qtd||0)+' un · aviso em '+(item.minimo||0);
    if(modKey==='condicional') sub = ((item.prazo&&item.prazo<hojeISO()&&item.status==='Com a cliente')?'⏰ VENCIDA · ':'')+'devolver até '+fmtDate(item.prazo);
    if(modKey==='vendas') sub = [fmtDate(item.data), item.cliente, [item.tamanho, item.qtd?'x'+item.qtd:''].filter(Boolean).join(' ')].filter(Boolean).join(' · ');
    let valueLine = '';
    if(item.valor) valueLine = `<div class="meta">${fmtMoney(item.valor)}</div>`;
    const codeTag = (item.codigoSistema && vRank===0) ? `<div class="codetag">${item.codigoSistema}</div>` : '';
    const photoIds = [item.fotos, item.fotosExtra].filter(Boolean).join(',').split(',').map(s=>s.trim()).filter(Boolean);
    const thumbs = photoIds.length ? `<div class="cardthumbs">${photoIds.slice(0,3).map(id=>`<img src="/_blob/${id}" alt="foto">`).join('')}</div>` : '';
    card.innerHTML = `<div class="top"><div>${codeTag}<div class="name">${title}</div></div>${status?`<span class="badge" style="background:${colors[0]};color:${colors[1]}">${status}</span>`:''}</div>
      <div class="meta">${sub}</div>${valueLine}${thumbs}`;
    card.onclick = ()=>go('form', modKey, item.id);
    const addWa = (txt, tel, msg)=>{ const w = document.createElement('button'); w.type='button'; w.className='bigbtn secondary'; w.style.cssText='margin-top:8px;padding:8px;font-size:14px;'; w.textContent = txt; w.onclick = e=>{ e.stopPropagation(); window.open(waLink(tel,msg),'_blank'); }; card.appendChild(w); };
    if(modKey==='condicional' && item.telefone && status==='Com a cliente') addWa('💬 Cobrar retorno', item.telefone, `Oi ${(item.cliente||'').split(' ')[0]}! Tudo bem? Passando para saber como foram as peças da sacolinha 💚 Preciso do retorno até ${fmtDate(item.prazo)}. Quais você vai ficar?`);
    if(modKey==='espera' && item.telefone && status!=='Comprou') addWa('💬 Avisar que chegou', item.telefone, `Oi ${(item.cliente||'').split(' ')[0]}! Chegou a peça que você queria na FM Fit Club: ${item.produto||''}${item.tamanho?' ('+item.tamanho+')':''}. Quer que eu separe pra você? 💚`);
    if(modKey==='vendas'){ const c = cliAll.find(x=>(x.nome||'').trim().toLowerCase()===(item.cliente||'').trim().toLowerCase()); if(c && c.telefone) addWa('💬 Pós-venda', c.telefone, `Oi ${c.nome.split(' ')[0]}! Aqui é da FM Fit Club 🌼 Gostou da sua peça? Se puder, manda uma foto treinando com ela pra gente! E se indicar uma amiga, vocês duas ganham um mimo 💚`); }
    if(modKey==='visitas' && vRank===0){
      const mn = minParaVisita(item);
      if(mn!==null){ card.classList.add('destaque'); card.querySelector('.name').insertAdjacentHTML('beforeend', `<span class="vtag">⏰ ${mn===0?'agora':'em '+mn+' min'}</span>`); }
    }
    if(vRank>0){
      const esc = t=>String(t||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
      card.querySelector('.name').insertAdjacentHTML('beforeend','<span class="vchev">▾</span>');
      const det = document.createElement('div');
      det.className='vdetails'; det.style.display='none';
      det.innerHTML = `${item.cliente?`<div><strong>Cliente:</strong> ${esc(item.cliente)}</div>`:''}${item.impressao?`<div><strong>Impressão:</strong> ${esc(item.impressao)}</div>`:''}${item.impressaoObs?`<div><strong>Disse:</strong> ${esc(item.impressaoObs)}</div>`:''}${item.obs?`<div><strong>Obs.:</strong> ${esc(item.obs)}</div>`:''}<button type="button" class="bigbtn secondary admin-only" style="margin-top:8px; padding:8px; font-size:14px;">✏️ Editar</button>`;
      det.querySelector('button').onclick = e=>{ e.stopPropagation(); go('form', modKey, item.id); };
      card.appendChild(det);
      card.onclick = ()=>{
        const open = det.style.display==='none';
        det.style.display = open ? 'block' : 'none';
        card.querySelector('.vchev').textContent = open ? '▴' : '▾';
        if(vRank===2) card.style.opacity = open ? '1' : '';
      };
    }
    if(modKey==='visitas' && vRank===0){
      const icsBtn = document.createElement('button');
      icsBtn.type='button'; icsBtn.className='bigbtn secondary';
      icsBtn.style.cssText='margin-top:8px; padding:8px; font-size:14px;';
      icsBtn.textContent='📅 Adicionar ao calendário (.ics)';
      icsBtn.onclick = (e)=>{ e.stopPropagation(); exportarVisitaICS(item); };
      card.appendChild(icsBtn);
    }
    listWrap.appendChild(card);
  });
  if(modKey==='visitas' && focoVisitas){
    focoVisitas = false;
    const d = listWrap.querySelector('.destaque');
    if(d) setTimeout(()=>d.scrollIntoView({behavior:'smooth', block:'center'}), 150);
  }
}

async function renderForm(modKey, id){
  const m = MODULES[modKey];
  pageTitle.innerHTML = `<div class="pagelabel">${id ? 'Editar' : 'Novo registro'}</div>`;
  let data = {};
  if(id){
    const items = await getAll(modKey);
    data = items.find(x=>x.id===id) || {};
  }
  const basicFields = m.fields.filter(f=>!f.extra);
  const extraFields = m.fields.filter(f=>f.extra);
  const hasExtra = extraFields.length > 0;
  const refs = {};
  for(const f of m.fields){ if(f.ref && !refs[f.ref]) refs[f.ref] = await getAll(f.ref); }

  function fieldHtml(f){
    const wrap = h => f.grp ? `<div class="fgrp" data-grp="${f.grp}">${h}</div>` : h;
    if(f.type==='section'){
      return wrap(`<div class="section-title">${f.label}</div>`);
    }
    const val = data[f.key] || '';
    let input;
    if(f.type==='select'){
      input = `<select id="f_${f.key}"><option value="">Selecione…</option>` +
        (f.ref ? refs[f.ref].map(r=>[r.id, r.nome||r.razaoSocial||'(sem nome)']) : f.options.map(o=>[o,o])).map(([v,l])=>`<option value="${v}" ${v===val?'selected':''}>${l}</option>`).join('') + `</select>`;
    }else if(f.type==='textarea'){
      input = `<textarea id="f_${f.key}">${val}</textarea>`;
    }else if(f.type==='checklist'){
      const checked = (val||'').split(',').map(s=>s.trim()).filter(Boolean);
      input = `<div class="checkgrid" id="f_${f.key}">` + f.options.map((o,i)=>
        `<label class="checkitem"><input type="checkbox" value="${o}" ${checked.includes(o)?'checked':''}> ${o}</label>`
      ).join('') + `</div>`;
    }else if(f.type==='photos'){
      input = `<div class="photobox">
        <div class="thumbstrip" id="f_${f.key}_thumbs"></div>
        <input type="file" id="f_${f.key}_input" accept="image/*" multiple style="display:none">
        <button type="button" class="bigbtn secondary" id="f_${f.key}_addbtn" style="margin-top:8px;">📷 Adicionar fotos</button>
        <div class="photohint" id="f_${f.key}_hint"></div>
      </div>`;
    }else if(f.type==='docfiles'){
      input = `<div class="photobox">
        ${f.docHelp ? `<button type="button" class="bigbtn secondary" id="f_${f.key}_help" style="margin-bottom:8px;">❓ Como enviar a CNH pelo app do governo</button>` : ''}
        <div class="thumbstrip" id="f_${f.key}_thumbs"></div>
        <input type="file" id="f_${f.key}_input" accept="image/*,application/pdf" multiple style="display:none">
        <button type="button" class="bigbtn secondary" id="f_${f.key}_addbtn" style="margin-top:8px;">📎 Adicionar documento</button>
        <div class="photohint" id="f_${f.key}_hint"></div>
      </div>`;
    }else{
      input = `<input id="f_${f.key}" type="${f.type}" value="${val}">`;
    }
    const label = f.label ? `<label for="f_${f.key}">${f.label}${f.req?' *':''}</label>` : '';
    return wrap(label + input);
  }

  let html = data.codigoSistema ? `<div class="codeline">Código: ${data.codigoSistema}</div>` : '';
  html += basicFields.map(fieldHtml).join('');
  if(hasExtra){
    const dataHasExtra = extraFields.some(f=>f.key && data[f.key]);
    html += `<button type="button" class="bigbtn secondary" id="toggleExtra" style="margin-top:8px">
      <span id="toggleExtraLabel">${dataHasExtra ? 'Ocultar' : 'Ver'} cadastro completo</span> ▾</button>
      <div id="extraWrap" style="display:${dataHasExtra?'block':'none'}; margin-top:6px;">
      ${extraFields.map(fieldHtml).join('')}
      </div>`;
  }
  if(modKey==='clientes' && id){
    html += `<div class="section-title">Linha do tempo de interações</div>
      <div id="timelineList"></div>
      <textarea id="novaInteracao" placeholder="Ex: liguei e ela disse que decide até sexta…"></textarea>
      <label>🔔 Lembrar em (opcional)</label>
      <input type="date" id="novaInteracaoData">
      <button type="button" class="bigbtn secondary" id="addInteracaoBtn" style="margin-top:6px;">+ Registrar interação</button>`;
  }
  html += `<div class="rowbtns">
      <button type="submit" class="bigbtn" style="flex:2">💾 Salvar</button>
    </div>` +
    (id && modKey==='imoveis' ? `<button type="button" class="bigbtn secondary" id="shareBtn" style="margin-top:4px">📲 Compartilhar no WhatsApp</button>` : '') +
    (id && modKey==='imoveis' ? `<button type="button" class="bigbtn secondary" id="contractBtn" style="margin-top:12px">📄 Gerar contrato</button>` : '') +
    (id && modKey==='imoveis' ? `<button type="button" class="bigbtn secondary" id="radarBtn" style="margin-top:4px">🎯 Clientes compatíveis</button><div id="radarBox"></div>` : '') +
    (id && modKey==='caixa' ? `<button type="button" class="bigbtn secondary admin-only" id="reciboBtn" style="margin-top:4px">🧾 Gerar recibo (PDF)</button>` : '') +
    (id && modKey==='visitas' ? `<button type="button" class="bigbtn secondary" id="retornoBtn" style="margin-top:4px">💬 Mensagem de retorno (WhatsApp)</button>` : '') +
    (id ? `<button type="button" class="bigbtn danger" id="delBtn" style="margin-top:12px">🗑 Excluir registro</button>` : '');

  const form = document.createElement('form');
  form.id = 'recForm';
  form.innerHTML = html;
  app.appendChild(form);
  if(isViewer()){
    form.querySelectorAll('input,select,textarea').forEach(el=> el.disabled = true);
    form.querySelectorAll('[id$="_addbtn"], #addInteracaoBtn, #toggleExtra').forEach(el=> el.style.display='none');
    const sub = form.querySelector('button[type=submit]'); if(sub) sub.style.display='none';
    ['f_valor','f_valorDe'].forEach(i=>{ const el=document.getElementById(i); if(el){ el.style.display='none'; el.insertAdjacentHTML('afterend', '<div>'+LOCK+'</div>'); } });
    ['delBtn','shareBtn','contractBtn'].forEach(i=>{ const b=document.getElementById(i); if(b) b.style.display='none'; });
    const eb = document.getElementById('extraWrap'); if(eb) eb.style.display='block';
  }
  function applyGroups(){
    const tp = document.getElementById('f_tipoPessoa'), ec = document.getElementById('f_estadoCivil');
    if(!tp) return;
    const pj = tp.value==='Pessoa Jurídica';
    const casado = !!ec && ['Casado(a)','União estável'].includes(ec.value);
    form.querySelectorAll('.fgrp').forEach(el=>{
      const g = el.getAttribute('data-grp');
      el.style.display = (g==='pj' ? pj : g==='pf' ? !pj : g==='casado' ? (!pj && casado) : true) ? '' : 'none';
    });
  }
  ['f_tipoPessoa','f_estadoCivil'].forEach(i=>{ const el = document.getElementById(i); if(el) el.onchange = applyGroups; });
  applyGroups();

  if(hasExtra){
    const toggleBtn = document.getElementById('toggleExtra');
    const extraWrap = document.getElementById('extraWrap');
    const toggleLabel = document.getElementById('toggleExtraLabel');
    toggleBtn.onclick = ()=>{
      const open = extraWrap.style.display !== 'none';
      extraWrap.style.display = open ? 'none' : 'block';
      toggleLabel.textContent = open ? 'Ver cadastro completo' : 'Ocultar cadastro completo';
    };
  }

  if(modKey==='clientes' && id){
    let interacoes = [];
    try{ interacoes = JSON.parse(data.interacoes || '[]'); }catch(e){ interacoes = []; }
    const timelineList = document.getElementById('timelineList');
    function paintTimeline(){
      timelineList.innerHTML = interacoes.length ? interacoes.slice().reverse().map(it=>
        `<div class="card" style="cursor:default;"><div class="meta" style="font-weight:700;">${it.data}</div><div class="meta">${it.nota}</div>${it.lembrete?`<div class="meta" style="color:var(--warn); font-weight:700;">🔔 Lembrete: ${fmtDate(it.lembrete)}</div>`:''}</div>`
      ).join('') : '<div class="photohint">Nenhuma interação registrada ainda.</div>';
    }
    paintTimeline();
    document.getElementById('addInteracaoBtn').onclick = async ()=>{
      const txt = document.getElementById('novaInteracao').value.trim();
      const lembrete = document.getElementById('novaInteracaoData').value;
      if(!txt){ toast('Escreva algo antes de registrar.'); return; }
      interacoes.push({data: new Date().toLocaleDateString('pt-BR'), nota: txt, lembrete: lembrete||null});
      paintTimeline();
      document.getElementById('novaInteracao').value = '';
      document.getElementById('novaInteracaoData').value = '';
      await saveDoc(modKey, id, {...data, interacoes: JSON.stringify(interacoes)});
      toast(lembrete ? 'Interação registrada com lembrete!' : 'Interação registrada!');
    };
  }

  // --- Fotos: liga cada campo do tipo "photos" ---
  const photoGetters = {};
  const photoFields = m.fields.filter(f=>f.type==='photos');
  photoFields.forEach(f=>{
    let ids = (data[f.key]||'').split(',').map(s=>s.trim()).filter(Boolean);
    const max = f.max || 5;
    const thumbsEl = document.getElementById('f_'+f.key+'_thumbs');
    const inputEl = document.getElementById('f_'+f.key+'_input');
    const addBtn = document.getElementById('f_'+f.key+'_addbtn');
    const hintEl = document.getElementById('f_'+f.key+'_hint');

    function paint(){
      thumbsEl.innerHTML = ids.map(pid=>`<div class="thumb"><img src="/_blob/${pid}" alt="foto"><button type="button" class="thumbx" data-id="${pid}">×</button></div>`).join('');
      thumbsEl.querySelectorAll('.thumbx').forEach(btn=>{
        btn.onclick = async ()=>{
          const rid = btn.getAttribute('data-id');
          ids = ids.filter(x=>x!==rid);
          paint();
          if(assetsApi){ try{ await assetsApi.delete(rid); }catch(e){} }
        };
      });
      hintEl.textContent = ids.length + ' de ' + max + ' fotos';
      addBtn.style.display = ids.length >= max ? 'none' : 'inline-block';
      if(!assetsApi) hintEl.textContent += ' — envio de fotos indisponível nesta visualização';
    }
    paint();
    addBtn.onclick = ()=> inputEl.click();
    inputEl.onchange = async ()=>{
      if(!assetsApi){ toast('Fotos não disponíveis nesta visualização.'); return; }
      const files = Array.from(inputEl.files).slice(0, max - ids.length);
      for(const file of files){
        try{
          const blob = await resizeImage(file);
          const res = await assetsApi.upload(blob, {type:'image/jpeg'});
          ids.push(res.id);
          paint();
        }catch(err){ toast('Não foi possível enviar uma das fotos.'); }
      }
      inputEl.value = '';
    };
    photoGetters[f.key] = ()=>ids.join(',');
  });

  // --- Documentos (imagem ou PDF): liga cada campo do tipo "docfiles" ---
  const docFields = m.fields.filter(f=>f.type==='docfiles');
  docFields.forEach(f=>{
    let ids = (data[f.key]||'').split(',').map(s=>s.trim()).filter(Boolean);
    const max = f.max || 6;
    const thumbsEl = document.getElementById('f_'+f.key+'_thumbs');
    const inputEl = document.getElementById('f_'+f.key+'_input');
    const addBtn = document.getElementById('f_'+f.key+'_addbtn');
    const hintEl = document.getElementById('f_'+f.key+'_hint');
    function paint(){
      thumbsEl.innerHTML = ids.map(entry=>{
        const [pid, kind] = entry.split('|');
        const isPdf = kind==='pdf';
        return `<div class="thumb">${isPdf ? `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#eee;font-size:26px;">📄</div>` : `<img src="/_blob/${pid}" alt="documento">`}<button type="button" class="thumbx" data-id="${entry}">×</button></div>`;
      }).join('');
      thumbsEl.querySelectorAll('.thumbx').forEach(btn=>{
        btn.onclick = async ()=>{

      lista.forEach(c=>{

        d.querySelector('button').onclick = ()=> window.open(waLink(c.telefone, MODELOS[0].t.replace('{nome}',(c.nome||'').split(' ')[0]).replace('{imovel}',`${data.tipo||'imóvel'} em ${data.cidade||''} — ${data.endereco||''}`)),'_blank');
        box.appendChild(d);
      });
    };
    document.getElementById('shareBtn').onclick = ()=>{
      const isEmpresa = data.tipo==='Empresa (M&A)';
      const linhas = [
        `${isEmpresa?'🏢':'🏠'} *${data.titulo || data.endereco || ''}*`,
        [data.tipo, data.bairro].filter(Boolean).join(' — '),
        data.valor ? `💰 ${fmtMoney(data.valor)}` : '',
        (data.descricaoCompleta || data.obs || '').split('\n')[0].slice(0,220),
        '',
        'Fale com a FM Fit Club: https://wa.me/5517981740013'
      ].filter(Boolean);
      window.open('https://wa.me/?text=' + encodeURIComponent(linhas.join('\n')), '_blank');
    };
    document.getElementById('contractBtn').onclick = ()=> go('contract', modKey, id);
  }
  if(id){
    document.getElementById('delBtn').onclick = async ()=>{
      const ok = await confirmModal(modKey==='vendas'&&data.baixado ? 'Excluir esta venda? A peça volta ao estoque e o valor sai do Caixa (serve para troca ou devolução).' : 'Tem certeza que deseja excluir este registro? Essa ação não pode ser desfeita.');

        await deleteDoc(modKey, id);
        toast('Registro excluído.');
        go('list', modKey);
      }
    };
  }
}

async function pdfRelatorio(marca, cor, mes, secoes){

  doc.setFontSize(10); doc.setTextColor(255,255,255); doc.text('Relatório mensal · '+mes, ML, 50);
  let y = 96; doc.setTextColor(30,30,30);
  secoes.forEach(([t,l])=>{
    if(y>H-90){ doc.addPage(); y = 56; }
    doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.text(t, ML, y); y += 6; doc.setDrawColor(200,200,200); doc.line(ML,y,MR,y); y += 16; doc.setFont('helvetica','normal'); doc.setFontSize(11);
    (l.length ? l : [['Sem lançamentos','']]).forEach(([a,b])=>{ if(y>H-50){ doc.addPage(); y = 56; } doc.text(String(a), ML, y); doc.text(String(b).replace(/\u00a0/g,' '), MR, y, {align:'right'}); y += 16; });
    y += 10;
  });
  doc.setFontSize(8); doc.setTextColor(120,120,120); doc.text('Relatório gerado automaticamente a partir dos cadastros em '+new Date().toLocaleDateString('pt-BR'), ML, H-28);
  await entregarPdf(doc, 'relatorio-'+mes+'.pdf', 'Relatório mensal');
}

    <label class="checkitem" style="margin:12px 0;"><input type="checkbox" id="eL" checked> Lançar no Caixa como despesa</label>
    <div id="eR" class="photohint"></div><button type="button" class="bigbtn" id="eOk">✅ Registrar entrada</button>`;
  const calc = ()=>{ const p = ps[$('eP').value]; if(!p){ $('eR').textContent = ''; return; } const add = TAM.reduce((a,t)=>a+num($('eq'+t).value),0), c = num($('eC').value), antes = totalPc(p);
    $('eR').textContent = add&&c ? `Custo médio novo: ${_fm(((antes*num(p.custo))+(add*c))/(antes+add))} (antes ${_fm(num(p.custo))}) · total da compra ${_fm(add*c)}` : ''; };
  ['eP','eC',...TAM.map(t=>'eq'+t)].forEach(i=>$(i).oninput = calc); $('eP').onchange = calc;
  $('eOk').onclick = async()=>{ const p = ps[$('eP').value]; if(!p) return toast('Escolha o produto'); const add = TAM.reduce((a,t)=>a+num($('eq'+t).value),0); if(!add) return toast('Digite as quantidades');
    const c = num($('eC').value) || num(p.custo), antes = totalPc(p), novo = (antes+add)>0 ? ((antes*num(p.custo))+(add*c))/(antes+add) : c;
    for(const t of TAM){ const q = num($('eq'+t).value); if(q>0){ p['q'+t] = (num(p['q'+t])||0)+q; await logMov(p.nome,t,q,'Entrada'); } }
    p.custo = String(Math.round(novo*100)/100); const {id,...rest} = p; await saveDoc('produtos',id,rest);
    if($('eL').checked && c>0) await saveDoc('caixa','CAI'+Date.now(),{descricao:'Compra: '+p.nome,tipo:'Despesa',categoria:'Fornecedor / compra de peças',valor:String(Math.round(add*c*100)/100),data:hojeISO(),status:'Recebido',formaPgto:'',cliente:p.fornecedor||''});
    toast('Entrada registrada!'); go('estoque'); };
}

let OCULTAR = false; try{ OCULTAR = localStorage.getItem('fe_oculta')==='1'; }catch(e){}
const _fm = fmtMoney; fmtMoney = v=> OCULTAR ? 'R$ ••••' : _fm(v);
function pintaOlho(){ document.body.classList.toggle('ocultar',OCULTAR); document.getElementById('ocultarBtn').textContent = OCULTAR ? '🙈 Mostrar' : '👁️ Ocultar'; }
document.getElementById('ocultarBtn').onclick = ()=>{ OCULTAR = !OCULTAR; try{ localStorage.setItem('fe_oculta',OCULTAR?'1':'0'); }catch(e){} pintaOlho(); render(); };
pintaOlho();

render();
</script>
